{% extends "layouts/admin_layout.html" %}
{% block title %}Users{% endblock %}
{% block app_content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h3 fw-semibold mb-0">User Management</h1>
  <input type="search" id="userSearch" class="form-control" style="max-width:280px" placeholder="Search users">
</div>
<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover mb-0 align-middle">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Action</th></tr></thead>
      <tbody id="usersBody"><tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script>AdminUsers.init();</script>
{% endblock %}
