{% extends "layouts/admin_layout.html" %}
{% block title %}Reports{% endblock %}
{% block extra_head %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>{% endblock %}
{% block app_content %}
<h1 class="h3 fw-semibold mb-4">Reports</h1>
<div class="row g-3">
  <div class="col-lg-6">
    <div class="card shadow-sm h-100"><div class="card-body">
      <h2 class="h6 fw-semibold">URL vs Message Scans</h2>
      <canvas id="typeChart" height="220"></canvas>
    </div></div>
  </div>
  <div class="col-lg-6">
    <div class="card shadow-sm h-100"><div class="card-body">
      <h2 class="h6 fw-semibold">Daily Scan Trend (30 days)</h2>
      <canvas id="dailyChart" height="220"></canvas>
    </div></div>
  </div>
  <div class="col-12">
    <div class="card shadow-sm"><div class="card-body">
      <h2 class="h6 fw-semibold">Monthly Scan Trend</h2>
      <canvas id="monthlyChart" height="120"></canvas>
    </div></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script>AdminReports.init();</script>
{% endblock %}
