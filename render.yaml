services:
  - type: web
    name: scam-phishing-detection
    env: python
    buildCommand: pip install -r requirements.txt && python models/train_models.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: REQUIRE_ML_MODELS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
